<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resetare parolă — Atelierul de broderie</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Resetare parolă</h2>
      <form>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        />
        <button class="btn btn-warning w-100 mt-3" type="submit">
          Trimite link de resetare
        </button>
      </form>
      <div class="login-footer mt-3">
        Ți-ai amintit parola?
        <a class="btn btn-primary" href="/login.html">Autentificare</a>
      </div>
      <div class="mt-2">
        Nu ai cont?
        <a class="btn btn-success" href="/signup.html">Înregistrează-te</a>
      </div>
      <div class="mt-2">
        <a href="/index.html" class="btn btn-secondary w-100"
          >Înapoi la pagina principală</a
        >
      </div>
    </div>
  </body>
</html>
