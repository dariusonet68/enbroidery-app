<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Înregistrare — Atelierul de broderie</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Înregistrare</h2>
      <form>
        <label for="name">Nume complet</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Numele tău complet"
          required
        />
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        />
        <label for="password">Parolă</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Parola"
          required
        />
        <label for="confirm-password">Confirmă parola</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Confirmă parola"
          required
        />
        <button class="btn btn-success w-100 mt-3" type="submit">
          Înregistrează-te
        </button>
      </form>
      <div class="login-footer mt-3">
        Ai deja cont?
        <a class="btn btn-primary" href="/login.html">Autentificare</a>
      </div>
      <div class="mt-2">
        <a href="/index.html" class="btn btn-secondary w-100"
          >Înapoi la pagina principală</a
        >
      </div>
    </div>
  </body>
</html>
